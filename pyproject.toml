[project]
name = "smart-speaker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.5",
  "openwakeword>=0.6",
  "openai>=1.40",
  "edge-tts>=6.1",
  "mcp>=1.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
smart-speaker = "smart_speaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_speaker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
